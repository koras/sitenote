<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки по сайтам</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Заметки</div>
      <div id="site-name" class="site-name" title="Текущий сайт">Определяем сайт…</div>
    </header>

    <main id="workspace" class="workspace" hidden>
      <section class="editor" aria-label="Редактор заметки">
        <div id="empty-note" class="empty-note">
          <div class="empty-icon" aria-hidden="true">✎</div>
          <h1>Здесь будет заметка</h1>
          <p>Выберите заметку справа или нажмите «Новая», чтобы открыть форму новой заметки.</p>
        </div>

        <div id="note-editor" class="note-editor" hidden>
          <label class="field-label" for="note-title">Название</label>
          <input id="note-title" class="title-input" type="text" maxlength="120" autocomplete="off" placeholder="Название заметки">

          <div class="editor-tools">
            <label class="color-control" for="note-color">
              <span>Цвет кнопки</span>
              <input id="note-color" type="color" aria-label="Цвет кнопки заметки">
            </label>
            <button id="delete-note" class="delete-button" type="button" title="Удалить заметку">Удалить</button>
          </div>

          <label class="field-label" for="note-content">Текст заметки</label>
          <textarea id="note-content" spellcheck="true" placeholder="Запишите здесь нужную информацию…"></textarea>
          <div class="timestamps">
            <div>Создана: <time id="created-at"></time></div>
            <div>Изменена: <time id="updated-at"></time></div>
          </div>
        </div>
      </section>

      <aside class="notes-sidebar" aria-label="Список заметок">
        <div class="sidebar-heading">
          <h2>Заметки</h2>
          <button id="new-note" class="new-button" type="button">+ Новая</button>
        </div>
        <div id="note-list" class="note-list"></div>
      </aside>
    </main>

    <div id="unsupported" class="unsupported" hidden>
      <div class="empty-icon" aria-hidden="true">◎</div>
      <h1>Откройте сайт</h1>
      <p>Заметки доступны для обычных страниц с адресом http или https. На служебных страницах Chrome они не открываются.</p>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="panel.mjs"></script>
</body>
</html>
